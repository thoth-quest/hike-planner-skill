name: Deploy hiking plan previews
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tests/**"
      - "scripts/**"
      - "schemas/**"
      - "package*.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node for validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Validate multi-plan data and browser JS
        run: |
          node --check site/assets/app.js
          node --check site/assets/detail.js
          node --check site/assets/timeline.mjs
          node --check scripts/plans.mjs
          node --test tests/*.test.mjs
      - name: Browser regression checks
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published content
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/verify-pages.mjs; then exit 0; fi
            sleep 10
          done
          echo "::error::Published content does not match this commit. Check Pages source and competing deployments."
          exit 1
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: test-results/
