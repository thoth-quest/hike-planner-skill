name: Deploy hiking plan previews
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tests/site.test.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node for validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate multi-plan data and browser JS
        run: |
          node --check site/assets/app.js
          node --check site/assets/detail.js
          node --check scripts/plans.mjs
          node --test tests/site.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published content (prevent false green deployments)
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          echo "Published URL reported by GitHub: ${PAGE_URL}"
          echo "Pages configuration (public fields):"
          curl -sS --connect-timeout 10 --max-time 20             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"             | node -e 'let text="";process.stdin.on("data",v=>text+=v);process.stdin.on("end",()=>{try{let o=JSON.parse(text);console.log(JSON.stringify({html_url:o.html_url,status:o.status,cname:o.cname,source:o.source,public:o.public,message:o.message}))}catch(e){console.log("Could not inspect Pages settings")}})'
          for attempt in 1 2 3 4 5 6 7 8; do
            home=$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 "${PAGE_URL}" || true)
            detail=$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 "${PAGE_URL}plan.html?id=oyama-day-hike" || true)
            data=$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 "${PAGE_URL}plans/oyama-day-hike/activity.json" || true)
            echo "Probe ${attempt}: home=${home} detail=${detail} activity.json=${data}"
            if [ "${home}" = "200" ] && [ "${detail}" = "200" ] && [ "${data}" = "200" ]; then
              echo "Pages is externally reachable from GitHub Actions."
              exit 0
            fi
            sleep 10
          done
          echo "::error::GitHub reported deployment success, but published URLs are unavailable. Check repo Settings > Pages, custom domain and publication status."
          exit 1
