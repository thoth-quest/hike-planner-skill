<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f7f3">
<meta name="description" content="日归登山计划：路线时间轴、行前交通、返程、天气与风险。">
<title>日归登山计划 · Hike Planner</title>
<link rel="stylesheet" href="./assets/site.css">
<script type="module" src="./assets/detail.js"></script>
</head>
<body data-page="detail">
<div class="site-shell">
  <header class="topbar">
    <a href="./" class="brand"><span class="brand-mark" aria-hidden="true">△</span> Hike Planner</a>
    <a class="back-link" href="./"><span aria-hidden="true">←</span> 返回计划列表</a>
  </header>
  <main class="detail-layout">
    <header class="trip-header">
      <div class="trip-header-upper"><span class="eyebrow">DAY HIKE / 一日徒步</span><span id="trip-status" class="trip-status">草稿</span></div>
      <h1 id="detail-title">正在读取计划…</h1>
      <p id="detail-summary" class="trip-subtitle"></p>
      <div id="detail-chips" class="trip-facts"></div>
    </header>
    <p id="detail-status" class="status-line" role="status">正在加载计划…</p>
    <nav id="detail-tabs" class="detail-tabs" role="tablist" aria-label="计划导航">
      <button type="button" id="tab-overview" role="tab" aria-controls="panel-overview" aria-selected="true" tabindex="0">计划 <span class="tab-count">01</span></button>
      <button type="button" id="tab-weather" role="tab" aria-controls="panel-weather" aria-selected="false" tabindex="-1">安全 <span class="tab-count">02</span></button>
      <button type="button" id="tab-route" role="tab" aria-controls="panel-route" aria-selected="false" tabindex="-1">路线 <span class="tab-count">03</span></button>
      <button type="button" id="tab-costs" role="tab" aria-controls="panel-costs" aria-selected="false" tabindex="-1">费用 <span class="tab-count">04</span></button>
      <button type="button" id="tab-history" role="tab" aria-controls="panel-history" aria-selected="false" tabindex="-1">记录 <span class="tab-count">05</span></button>
    </nav>
    <div class="tab-content">
      <section id="panel-overview" role="tabpanel" aria-labelledby="tab-overview" class="tab-panel"></section>
      <section id="panel-weather" role="tabpanel" aria-labelledby="tab-weather" class="tab-panel" hidden></section>
      <section id="panel-route" role="tabpanel" aria-labelledby="tab-route" class="tab-panel" hidden></section>
      <section id="panel-costs" role="tabpanel" aria-labelledby="tab-costs" class="tab-panel" hidden></section>
      <section id="panel-history" role="tabpanel" aria-labelledby="tab-history" class="tab-panel" hidden></section>
    </div>
  </main>
  <footer class="site-footer">本页为静态预览。时间为估算值，日期、天气、班次和路线状态均以出发前重新核实为准。</footer>
</div>
</body>
</html>
