<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>登山活动计划 · Hike Planner</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;background:#f5f7f4;color:#172b23;line-height:1.55}
*{box-sizing:border-box}body{margin:0}a{color:#146a57;overflow-wrap:anywhere}
.layout{max-width:800px;margin:auto;padding:22px 16px 88px}
header{background:linear-gradient(135deg,#123b30,#216f59);color:#fff;padding:32px 22px;border-radius:22px;box-shadow:0 16px 28px #17493622}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.77}
h1{font-size:clamp(25px,6vw,38px);line-height:1.2;margin:12px 0 14px}h2{font-size:18px;margin:0 0 16px}
.note{font-size:13px;opacity:.78}.tag{display:inline-block;padding:5px 11px;border-radius:20px;background:#ffffff26;font-size:12px}
.quick{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.metric{background:#ffffff12;padding:13px;border-radius:12px}.metric small{display:block;opacity:.74}.metric strong{font-size:16px}
.panel{margin-top:18px;padding:22px;border:1px solid #e1e8e0;border-radius:18px;background:#fff;box-shadow:0 3px 8px #173e2308}
.stack{display:grid;gap:10px}.item{padding:10px 0;border-bottom:1px solid #edf1ed}.item:last-child{border:0}
.sub{font-size:12px;color:#66796d}.emph{font-size:17px;font-weight:680}
.pill{display:inline-block;margin:4px 6px 4px 0;background:#ebf3ed;color:#1d6953;padding:4px 11px;font-size:12px;border-radius:20px}
.warn{background:#fff7eb;border:1px solid #f2d3a6;padding:12px;border-radius:12px;color:#775018}
.muted{color:#637267}.source{display:block;padding:10px 0;border-bottom:1px solid #e5ece5}
.footer{padding-top:22px;font-size:12px;color:#66796d}
button{cursor:pointer;background:#ecf3ee;border:1px solid #d5e3d8;border-radius:12px;padding:10px 14px;color:#1b5343;font-weight:600}
.actions{display:flex;justify-content:flex-end;margin-top:14px}
@media(min-width:680px){.quick{grid-template-columns:repeat(4,1fr)}.layout{padding-top:36px}}
@media print{body{background:#fff}.layout{padding:0}header{background:#123b30!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.actions{display:none}.panel{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<main class="layout">
<header>
<div class="kicker">HIKE PLANNER · STAGE 1</div>
<h1 id="title">活动规划</h1>
<div id="head-tags"></div>
<div class="quick" id="quick"></div>
<div class="actions"><button type="button" id="print" title="打印或保存为PDF">打印 / 保存PDF</button></div>
</header>
<section class="panel"><h2>01 · 活动目标</h2><div id="goal"></div></section>
<section class="panel"><h2>02 · 天气与可行性</h2><div id="weather"></div></section>
<section class="panel"><h2>03 · 候选地点与待定事项</h2><div id="options"></div></section>
<section class="panel"><h2>04 · 证据与修改记录</h2><div id="evidence"></div></section>
<footer class="footer">这是导出的离线快照，不会自动刷新天气或交通。外部链接需联网打开。请在出发前重新核对官方信息。</footer>
</main>
<script type="application/json" id="activity-data">__ACTIVITY_JSON__</script>
<script>
(function(){
"use strict";
var p=JSON.parse(document.getElementById("activity-data").textContent);
var by=function(id){return document.getElementById(id);};
function node(t,content,cls){var e=document.createElement(t); if(cls)e.className=cls;if(content!==null&&content!==undefined)e.textContent=String(content);return e;}
function add(parent,child){parent.appendChild(child);return child;}
function row(parent,label,value){var d=add(parent,node("div",null,"item"));add(d,node("div",label,"sub"));add(d,node("div",value===null||value===undefined||value===""?"待定":value,"emph"));}
function block(parent,text,cls){add(parent,node("div",text,cls||"item"));}
function tag(text){add(by("head-tags"),node("span",text,"tag"));}
function metric(label,value){var d=add(by("quick"),node("div",null,"metric"));add(d,node("small",label));add(d,node("strong",value||"待定"));}
function source(parent,entry){
 var a=document.createElement("a");
 try{var u=new URL(entry.url);if(u.protocol==="https:"||u.protocol==="http:"){a.href=u.href;a.target="_blank";a.rel="noopener noreferrer";}}
 catch(e){}
 a.textContent=entry.claim||entry.publisher||"查看来源";
 add(parent,a);add(parent,node("div",(entry.publisher||"")+ " · 核实于 "+(entry.checked_at||"未记录"),"sub"));
}
by("title").textContent=p.title||"户外活动";
tag(p.status==="confirmed"?"目标已确认":p.status==="needs_review"?"需要复核":"规划中");
tag("版本 "+(p.revision||1));
metric("目的地",p.destination&&p.destination.name);
metric("日期",p.constraints&&(p.constraints.date||p.constraints.date_range));
metric("主要目标",p.goals&&p.goals.primary);
metric("活动强度",p.constraints&&p.constraints.difficulty);
var g=by("goal");row(g,"主要目标",p.goals&&p.goals.primary);
var secondary=p.goals&&Array.isArray(p.goals.secondary)?p.goals.secondary:[];
if(secondary.length){block(g,"次要目标","sub");secondary.forEach(function(s){add(g,node("span",s,"pill"));});}
var c=p.constraints||{};row(g,"出发区域",c.departure_area);row(g,"预计人数",c.estimated_participants);row(g,"最晚返回",c.latest_return);
if(Array.isArray(c.hard_rules)&&c.hard_rules.length){block(g,"必须遵守的限制","sub");c.hard_rules.forEach(function(s){block(g,s,"warn");});}
var w=p.weather||{},wa=w.assessment||{},wx=by("weather");
var stateMap={pending:"尚未查询",unavailable:"暂时无法查询",current:"已有天气查询",stale:"天气数据需复核"};
row(wx,"天气状态",stateMap[w.status]||"待定");
row(wx,"活动建议",wa.recommendation);
if(wa.reason)block(wx,wa.reason,"muted");
if(Array.isArray(w.snapshots)&&w.snapshots.length){
var last=w.snapshots[w.snapshots.length-1];
row(wx,"最近核实时间",last.checked_at||"未记录");
if(last.valid_for)row(wx,"适用日期",last.valid_for);
if(last.values&&Object.keys(last.values).length){var vals=add(wx,node("div",null,"stack"));Object.keys(last.values).forEach(function(k){row(vals,k,JSON.stringify(last.values[k]));});}
if(last.sources&&last.sources.length)last.sources.forEach(function(url){source(wx,{url:url,claim:"查看天气来源",publisher:"外部来源",checked_at:last.checked_at});});
}else{block(wx,"尚无实时天气数据。确定日期后，应查询官方预报、山顶/山脚差异和气象警报。","warn");}
var op=by("options");
row(op,"目的地状态",p.destination&&p.destination.state);
var ca=Array.isArray(p.candidates)?p.candidates:[];if(!ca.length)block(op,"当前无待比较的候选地点。","muted");ca.forEach(function(x){block(op,(x.name||"候选")+ (x.reason?" · "+x.reason:""));});
var e=by("evidence");
var ev=Array.isArray(p.evidence)?p.evidence:[];if(!ev.length)block(e,"暂无已验证的外部资料。不能将估计值视作已核实事实。","muted");
ev.forEach(function(x){var d=add(e,node("div",null,"source"));source(d,x);});
var ch=Array.isArray(p.changes)?p.changes:[];
add(e,node("h3","修改记录 · "+ch.length+" 条"));
if(!ch.length)block(e,"暂未记录正式修改。","muted");
ch.forEach(function(x){block(e,"v"+x.revision+" · "+x.field+" · "+(x.reason||"") +" · "+(x.at||""),"item");});
by("print").addEventListener("click",function(){window.print();});
})();
</script>
</body>
</html>
